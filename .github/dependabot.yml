# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "npm"
    # Look for `package.json` and `lock` files in the `root` director
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    # Conventional-commit prefixes control what git-cliff releases (see cliff.toml):
    # runtime deps -> build(deps): ... (released as patch)
    # dev deps     -> chore(deps-dev): ... (skipped)
    commit-message:
      prefix: "build"
      prefix-development: "chore"
      include: "scope"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    # chore(deps): ... (skipped by cliff.toml, CI tooling doesn't warrant a release)
    commit-message:
      prefix: "chore"
      include: "scope"
