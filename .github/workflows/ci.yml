name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --ignore-scripts

      - run: pnpm test

      - run: pnpm typecheck

  release:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11

      - name: Install git-cliff
        uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96 # v2.77.2
        with:
          tool: git-cliff

      - name: Check if release is needed
        id: check
        run: |
          VERSION=$(RUST_LOG=error git-cliff --bumped-version 2>/dev/null || echo "")
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$VERSION" != "$CURRENT" ] && [ -n "$VERSION" ]; then
            echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
            echo "RELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "RELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version, update changelog, commit, and tag
        if: steps.check.outputs.RELEASE == 'true'
        env:
          VERSION: ${{ steps.check.outputs.VERSION }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm version "${VERSION#v}" --no-git-tag-version
          git-cliff --bump -o CHANGELOG.md
          git commit -am "chore(release): $VERSION"
          git tag "$VERSION" -m "Release $VERSION"
          git push origin main --follow-tags

      - name: Create GitHub Release
        if: steps.check.outputs.RELEASE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.VERSION }}
        run: |
          NOTES=$(git-cliff --latest --strip all)
          gh release create "$VERSION" --title "$VERSION" --notes "$NOTES"
