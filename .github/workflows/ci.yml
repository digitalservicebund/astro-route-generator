name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --ignore-scripts

      - run: pnpm test

      - run: pnpm typecheck

  release:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install git-cliff
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: git-cliff

      - name: Check if release is needed
        id: check
        run: |
          git fetch --tags --force
          VERSION=$(RUST_LOG=error git-cliff --bumped-version 2>/dev/null || echo "")
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$VERSION" != "$CURRENT" ] && [ -n "$VERSION" ] && ! git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
            echo "RELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "RELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version, update changelog, commit, and tag
        if: steps.check.outputs.RELEASE == 'true'
        env:
          VERSION: ${{ steps.check.outputs.VERSION }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm version "${VERSION#v}" --no-git-tag-version
          git-cliff --bump -o CHANGELOG.md
          git commit -am "chore(release): $VERSION [skip ci]"
          git tag "$VERSION" -m "Release $VERSION"
          git push origin main --follow-tags

      - name: Create GitHub Release
        if: steps.check.outputs.RELEASE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.VERSION }}
        run: |
          NOTES=$(git-cliff --latest --strip all)
          gh release create "$VERSION" --title "$VERSION" --notes "$NOTES"
